{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card"><div class="card-body">
    <h4 class="card-title mb-3">Log In</h4>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Log In</button>
    </form>
    <p class="mt-3 mb-0">Don't have an account? <a href="{% url 'accounts:register' %}">Register</a></p>
</div></div>
</div>
</div>
{% endblock %}
